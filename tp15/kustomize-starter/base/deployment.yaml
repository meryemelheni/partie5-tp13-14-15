apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10.0
        ports:
        - containerPort: 80
        env:
        - name: WHOAMI_NAME
          valueFrom:
            configMapKeyRef:
              name: whoami-config
              key: WHOAMI_NAME
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: whoami-config
              key: LOG_LEVEL
