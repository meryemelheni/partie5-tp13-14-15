apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tp15-prod
resources:
  - ../../base
replicas:
  - name: whoami
    count: 3
images:
  - name: traefik/whoami
    newTag: v1.10.1
configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=prod
      - LOG_LEVEL=warn
patches:
  - path: patch-limits.yaml
