replicaCount: 1
image:
  repository: traefik/whoami
  tag: v1.10.0
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  host: whoami.lab.local
env:
  WHOAMI_NAME: "default"
resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
