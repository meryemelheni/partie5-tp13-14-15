apiVersion: v1
kind: Service
metadata:
  name: {{ include "whoami.fullname" . }}
  labels:
    app: {{ include "whoami.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 80
    protocol: TCP
  selector:
    app: {{ include "whoami.name" . }}
