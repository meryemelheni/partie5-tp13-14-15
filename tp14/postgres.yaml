apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: tp14
type: Opaque
stringData:
  POSTGRES_PASSWORD: labpassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tp14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: bitnami/postgresql:16
        env:
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRESQL_DATABASE
          value: "mydb"
        volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
      volumes:
      - name: data
        emptyDir: {}
